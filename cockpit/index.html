<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>App Manager</title>
    <link rel="stylesheet" href="app-manager.css">
    <script src="../base1/cockpit.js"></script>
    <script src="icons.js" defer></script>
    <script src="app-manager.js" defer></script>
  </head>
  <body>
    <main class="am-app-manager" aria-busy="true">
      <header class="am-header">
        <div class="am-brand">
          <div class="am-brand-mark" aria-hidden="true">
            <i data-lucide="boxes"></i>
          </div>
          <div>
            <h1>App Manager</h1>
            <p class="am-header-copy">stuserver.online <span class="am-host-separator">/</span> Cockpit</p>
          </div>
        </div>
        <div class="am-header-actions">
          <span id="appManagerConnection" class="am-connection-status" role="status" aria-live="polite">
            <span class="am-status-dot" aria-hidden="true"></span>
            <span>Connecting…</span>
          </span>
          <button id="refreshButton" class="am-button am-button--quiet am-icon-button" type="button" title="Refresh applications" aria-label="Refresh applications">
            <i data-lucide="refresh-cw"></i><span class="am-visually-hidden">Refresh</span>
          </button>
          <button id="checkUpdateButton" class="am-button am-button--quiet am-icon-button" type="button" title="Check for plugin updates" aria-label="Check for plugin updates">
            <i data-lucide="download"></i><span class="am-visually-hidden">Check for updates</span>
          </button>
          <button class="am-button am-button--primary" type="button" data-open-add>
            <i data-lucide="plus"></i> New application
          </button>
        </div>
      </header>

      <div id="appManagerNotice" class="am-notice hidden" role="status" aria-live="polite"></div>
      <div id="appManagerError" class="am-error hidden" role="alert" aria-live="assertive"></div>
      <div id="overviewCards" class="am-metrics" aria-label="Application summary"></div>

      <nav class="am-tabs" role="tablist" aria-label="App Manager sections">
        <button id="tab-websites" class="am-tab tab active" type="button" role="tab" aria-selected="true" aria-controls="websites" tabindex="0" data-tab="websites"><i data-lucide="layout-grid" aria-hidden="true"></i>Applications <span id="appCount" class="am-tab-count">0</span></button>
        <button id="tab-deployments" class="am-tab tab" type="button" role="tab" aria-selected="false" aria-controls="deployments" tabindex="-1" data-tab="deployments"><i data-lucide="git-branch" aria-hidden="true"></i>Deployments</button>
        <button id="tab-overview" class="am-tab tab" type="button" role="tab" aria-selected="false" aria-controls="overview" tabindex="-1" data-tab="overview"><i data-lucide="activity" aria-hidden="true"></i>Activity</button>
        <button id="tab-settings" class="am-tab tab" type="button" role="tab" aria-selected="false" aria-controls="settings" tabindex="-1" data-tab="settings"><i data-lucide="settings-2" aria-hidden="true"></i>Settings</button>
      </nav>

      <section id="overview" class="am-panel tab-panel hidden" role="tabpanel" aria-labelledby="tab-overview" tabindex="0" hidden>
        <div class="am-section-heading">
          <div>
            <h2>Activity</h2>
          </div>
        </div>
        <section class="am-surface am-activity-panel" aria-labelledby="activityHeading">
          <div class="am-surface-heading">
            <div>
              <h3 id="activityHeading">Recent activity</h3>
            </div>
          </div>
          <div id="recentActivity" class="am-activity-list"></div>
        </section>
      </section>

      <section id="websites" class="am-panel tab-panel" role="tabpanel" aria-labelledby="tab-websites" tabindex="0">
        <div class="am-section-heading">
          <div>
            <h2>Applications</h2>
            <p id="appsResultCount" class="am-section-copy" role="status" aria-live="polite">Loading applications...</p>
          </div>
          <span id="lastRefreshed" class="am-field-hint"></span>
        </div>
        <div class="am-app-toolbar">
          <label class="am-search" for="appSearch"><i data-lucide="search"></i><span class="am-visually-hidden">Search applications</span><input id="appSearch" type="search" placeholder="Search applications..." autocomplete="off"></label>
          <div class="am-filters" role="group" aria-label="Filter applications">
            <button type="button" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter="running" aria-pressed="false">Live</button>
            <button type="button" data-filter="deploying" aria-pressed="false">Deploying</button>
            <button type="button" data-filter="failed" aria-pressed="false">Attention</button>
            <button type="button" data-filter="stopped" aria-pressed="false">Stopped</button>
          </div>
          <label class="am-sort" for="appSort"><span class="am-visually-hidden">Sort applications</span><select id="appSort"><option value="recent">Recently updated</option><option value="name">Name A-Z</option></select></label>
        </div>
        <div id="appsTableContainer" class="am-app-grid"><div class="am-loading" role="status"><i data-lucide="loader-circle"></i> Loading applications...</div></div>
      </section>

      <section id="deployments" class="am-panel tab-panel hidden" role="tabpanel" aria-labelledby="tab-deployments" tabindex="0">
        <div class="am-section-heading">
          <div>
            <h2>Deployments</h2>
          </div>
        </div>
        <div id="deploymentHistory"></div>
      </section>

      <section id="settings" class="am-panel tab-panel hidden" role="tabpanel" aria-labelledby="tab-settings" tabindex="0">
        <div class="am-section-heading">
          <div>
            <h2>Settings</h2>
          </div>
        </div>
        <div id="settingsPanel"></div>
      </section>
    </main>
    <dialog id="appManagerDialog" class="am-dialog" aria-labelledby="appManagerDialogTitle"></dialog>
    <template id="addAppFormTemplate">
      <ol class="am-setup-steps" aria-label="Application setup">
        <li data-setup-marker="0" aria-current="step"><span>1</span> Repository</li>
        <li data-setup-marker="1"><span>2</span> Configuration</li>
        <li data-setup-marker="2"><span>3</span> Review</li>
      </ol>
      <section data-setup-step="0" aria-labelledby="setupRepositoryTitle">
        <h3 id="setupRepositoryTitle" class="am-setup-title">Connect your repository</h3>
        <div class="am-form-grid">
          <div class="am-form-grid__wide">
            <label for="appRepo">Git repository</label>
            <input id="appRepo" required name="repo_url" type="text" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://github.com/owner/project.git" maxlength="2048" />
          </div>
          <div>
            <label for="appName">Application name</label>
            <input id="appName" required name="name" autocomplete="off" placeholder="Customer portal" maxlength="100" />
          </div>
          <div>
            <label for="appBranch">Production branch</label>
            <input id="appBranch" name="branch" value="main" autocomplete="off" required />
          </div>
        </div>
      </section>
      <section data-setup-step="1" aria-labelledby="setupRuntimeTitle" hidden>
        <h3 id="setupRuntimeTitle" class="am-setup-title">Runtime and public route</h3>
        <div class="am-form-grid">
          <div>
            <label for="appSlug">Application ID</label>
            <input id="appSlug" required name="slug" autocomplete="off" placeholder="customer-portal" pattern="[a-z0-9]([a-z0-9\-]{0,22}[a-z0-9])?" maxlength="24" />
          </div>
          <div>
            <label for="appFramework">Framework</label>
            <select id="appFramework" name="framework">
              <option value="auto">Auto detect</option>
              <option value="nextjs">Next.js</option>
              <option value="go">Go</option>
              <option value="node">Node.js</option>
              <option value="python">Python</option>
              <option value="static">Static HTML</option>
            </select>
          </div>
          <div class="am-form-grid__wide">
            <label for="appRoute">Hosted route</label>
            <input id="appRoute" required name="route" autocomplete="off" spellcheck="false" placeholder="/customer-portal/" maxlength="256" pattern="/([a-z0-9]([a-z0-9\-]{0,62}[a-z0-9])?/)+" />
            <output id="setupUrlPreview" class="am-url-preview" for="appRoute"></output>
          </div>
          <div>
            <label for="appHealthCheck">Health-check path</label>
            <input id="appHealthCheck" name="health_check_url" value="/" placeholder="/health" pattern="/[^\s]*" required />
          </div>
          <div>
            <label for="appDescription">Description <span class="am-optional">Optional</span></label>
            <input id="appDescription" name="description" placeholder="What does this application do?" />
          </div>
        </div>
        <details class="am-advanced">
          <summary>Runtime options</summary>
          <div class="am-form-grid">
            <div class="am-form-grid__wide"><label for="appDirectory">Next.js package directory <span class="am-optional">Optional</span></label><input id="appDirectory" name="app_directory" placeholder="apps/web" autocomplete="off" /></div>
            <div class="am-form-grid__wide"><label for="appStartCommand">Start command <span class="am-optional">JSON argument array</span></label><textarea id="appStartCommand" name="start_command" rows="2" spellcheck="false" placeholder='["node", "dist/server.js"]'></textarea></div>
          </div>
        </details>
        <section class="am-setup-environment" aria-labelledby="setupEnvironmentTitle">
          <div class="am-setup-environment__heading">
            <div>
              <h4 id="setupEnvironmentTitle">Environment variables <span class="am-optional">Optional</span></h4>
              <p>Private values are stored outside your repository and never shown in the review.</p>
            </div>
            <label class="am-button am-env-import-button" for="appEnvironmentImport">Import file</label>
            <input id="appEnvironmentImport" class="am-visually-hidden" type="file" accept=".env,.txt,.env.*,text/plain">
          </div>
          <label for="appEnvironment">Add one KEY=value per line</label>
          <textarea id="appEnvironment" name="environment" rows="6" autocomplete="off" spellcheck="false" placeholder="DATABASE_URL=&#10;API_KEY="></textarea>
          <small class="am-field-hint">Import a .env, .env.* or .txt file. Maximum size: 64 KiB.</small>
        </section>
      </section>
      <section data-setup-step="2" aria-labelledby="setupReviewTitle" hidden>
        <h3 id="setupReviewTitle" class="am-setup-title">Ready for the first release</h3>
        <dl id="setupReview" class="am-review-list"></dl>
        <label class="am-checkbox"><input type="checkbox" name="deploy_now" checked /><span>Deploy after setup</span></label>
      </section>
    </template>
  </body>
</html>
