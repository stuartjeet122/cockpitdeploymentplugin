<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>App Manager</title>
    <link rel="stylesheet" href="app-manager.css">
    <script src="/cockpit/login.js"></script>
    <script src="/cockpit/cockpit.js"></script>
    <script src="app-manager.js"></script>
  </head>
  <body>
    <div class="container am-app-manager">
      <div class="toolbar">
        <h2>App Manager</h2>
        <button id="refreshButton" class="pf-m-primary">Refresh</button>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="overview">Overview</button>
        <button class="tab" data-tab="websites">Websites</button>
        <button class="tab" data-tab="add-app">Add Application</button>
        <button class="tab" data-tab="deployments">Deployments</button>
        <button class="tab" data-tab="settings">Settings</button>
      </div>

      <section id="overview" class="tab-panel">
        <div id="overviewCards" class="cards"></div>
        <div class="card">
          <h3>Recent deployment activity</h3>
          <div id="recentActivity"></div>
        </div>
      </section>

      <section id="websites" class="tab-panel hidden">
        <div id="appsTableContainer"></div>
      </section>

      <section id="add-app" class="tab-panel hidden">
        <form id="addAppForm">
          <div class="row">
            <div>
              <label>Website name</label>
              <input required name="name" />
            </div>
            <div>
              <label>Application slug</label>
              <input required name="slug" />
            </div>
          </div>
          <div class="row">
            <div>
              <label>Git repository URL</label>
              <input required name="repo_url" />
            </div>
            <div>
              <label>Production branch</label>
              <input name="branch" value="main" />
            </div>
          </div>
          <div class="row">
            <div>
              <label>Framework</label>
              <select name="framework">
                <option value="auto">Auto detect</option>
                <option value="nextjs">Next.js</option>
                <option value="go">Go</option>
                <option value="node">Node.js</option>
                <option value="python">Python</option>
                <option value="static">Static</option>
              </select>
            </div>
            <div>
              <label>Health-check URL</label>
              <input name="health_check_url" placeholder="/health" />
            </div>
          </div>
          <div>
            <label>Optional description</label>
            <textarea name="description" rows="3"></textarea>
          </div>
          <div>
            <label>Build configuration</label>
            <textarea name="build_config" rows="3" placeholder='{"build_command": "npm run build"}'></textarea>
          </div>
          <button type="submit">Add application</button>
        </form>
      </section>

      <section id="deployments" class="tab-panel hidden">
        <div id="deploymentHistory"></div>
      </section>

      <section id="settings" class="tab-panel hidden">
        <div id="settingsPanel"></div>
      </section>
    </div>

    <script>
      async function callBackend(command, args = []) {
        const result = await cockpit.spawn(["/usr/libexec/cockpit/app-manager/app-manager", command, ...args], { superuser: "require" });
        return JSON.parse(result);
      }

      function escapeHtml(value) {
        return String(value || '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
      }

      function renderStatus(status) {
        return `<span class="status-pill" data-status="${escapeHtml(status || 'unknown')}">${escapeHtml(status || 'unknown')}</span>`;
      }

      function renderOverview(data) {
        const cards = [
          ['Total applications', data.total_apps],
          ['Running applications', data.running_apps],
          ['Stopped applications', data.stopped_apps],
          ['Failed deployments', data.failed_deployments],
          ['Available ports', data.available_ports.length],
        ];
        const html = cards.map(([label, value]) => `
          <div class="card">
            <small>${escapeHtml(label)}</small>
            <h3>${escapeHtml(value)}</h3>
          </div>
        `).join('');
        document.getElementById('overviewCards').innerHTML = html;

        const activity = (data.recent_activity || []).map((item) => `
          <div class="card"><strong>${escapeHtml(item.name)}</strong><div>${escapeHtml(item.action)} • ${escapeHtml(item.when)}</div></div>
        `).join('') || '<p>No recent deployment activity.</p>';
        document.getElementById('recentActivity').innerHTML = activity;
      }

      function renderApps(data) {
        const apps = data.apps || [];
        if (!apps.length) {
          document.getElementById('appsTableContainer').innerHTML = '<p>No applications registered yet.</p>';
          return;
        }

        const rows = apps.map((app) => `
          <tr>
            <td>${escapeHtml(app.name)}</td>
            <td>${escapeHtml(app.framework)}</td>
            <td>${escapeHtml(app.repo_url)}</td>
            <td>${escapeHtml(app.branch)}</td>
            <td>${escapeHtml(app.public_url)}</td>
            <td>${escapeHtml(app.port)}</td>
            <td>${renderStatus(app.status)}</td>
            <td>${escapeHtml(app.last_deploy || 'Not yet')}</td>
            <td>${escapeHtml(app.latest_commit || 'n/a')}</td>
            <td class="action-row">
              <button data-action="open" data-id="${escapeHtml(app.id)}">Open</button>
              <button data-action="deploy" data-id="${escapeHtml(app.id)}">Deploy</button>
              <button data-action="pull" data-id="${escapeHtml(app.id)}">Pull</button>
              <button data-action="edit" data-id="${escapeHtml(app.id)}">Edit</button>
              <button data-action="restart" data-id="${escapeHtml(app.id)}">Restart</button>
              <button data-action="stop" data-id="${escapeHtml(app.id)}">Stop</button>
              <button data-action="start" data-id="${escapeHtml(app.id)}">Start</button>
              <button data-action="logs" data-id="${escapeHtml(app.id)}">Logs</button>
              <button data-action="remove" data-id="${escapeHtml(app.id)}">Remove</button>
            </td>
          </tr>
        `).join('');

        document.getElementById('appsTableContainer').innerHTML = `
          <table class="table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Framework</th>
                <th>Repository</th>
                <th>Branch</th>
                <th>Public URL</th>
                <th>Port</th>
                <th>Status</th>
                <th>Last deploy</th>
                <th>Latest commit</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;

        document.querySelectorAll('[data-action]').forEach((button) => {
          button.addEventListener('click', async () => {
            const action = button.dataset.action;
            const id = button.dataset.id;
            const result = await callBackend('action', [action, id]);
            if (result.ok === false) {
              cockpit.message(result.error || 'Action failed');
            }
            await refreshData();
          });
        });
      }

      function renderDeployments(data) {
        const deployments = data.deployments || [];
        if (!deployments.length) {
          document.getElementById('deploymentHistory').innerHTML = '<p>No deployment history.</p>';
          return;
        }

        document.getElementById('deploymentHistory').innerHTML = `
          <table class="table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Date</th>
                <th>Commit</th>
                <th>Build status</th>
                <th>Deployment status</th>
                <th>Error</th>
              </tr>
            </thead>
            <tbody>
              ${deployments.map((deployment) => `
                <tr>
                  <td>${escapeHtml(deployment.name)}</td>
                  <td>${escapeHtml(deployment.date)}</td>
                  <td>${escapeHtml(deployment.commit || 'n/a')}</td>
                  <td>${escapeHtml(deployment.build_status || 'pending')}</td>
                  <td>${escapeHtml(deployment.status || 'pending')}</td>
                  <td>${escapeHtml(deployment.error || '—')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      function renderSettings(data) {
        const config = data.config || {};
        const html = `
          <div class="card">
            <h3>Deployment settings</h3>
            <ul>
              <li>Port range: ${escapeHtml(config.port_range ? `${config.port_range.start}-${config.port_range.end}` : '8100-8999')}</li>
              <li>Source root: ${escapeHtml(config.source_root || '/var/lib/cockpit/app-manager/sources')}</li>
              <li>Production root: ${escapeHtml(config.production_root || '/opt/webapps')}</li>
              <li>Release retention: ${escapeHtml(config.release_retention || 5)}</li>
              <li>Build timeout: ${escapeHtml(config.build_timeout_seconds || 900)} seconds</li>
              <li>Health timeout: ${escapeHtml(config.health_timeout_seconds || 30)} seconds</li>
            </ul>
            <form id="settingsForm">
              <div class="row">
                <div>
                  <label>Release retention</label>
                  <input type="number" min="0" step="1" name="release_retention" value="${escapeHtml(config.release_retention || 5)}" />
                </div>
                <div>
                  <label>Health timeout seconds</label>
                  <input type="number" min="1" step="1" name="health_timeout_seconds" value="${escapeHtml(config.health_timeout_seconds || 30)}" />
                </div>
              </div>
              <button type="submit">Save settings</button>
            </form>
          </div>
        `;
        document.getElementById('settingsPanel').innerHTML = html;

        const settingsForm = document.getElementById('settingsForm');
        if (settingsForm) {
          settingsForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const formData = new FormData(event.target);
            const payload = Object.fromEntries(formData.entries());
            payload.release_retention = Number(payload.release_retention);
            payload.health_timeout_seconds = Number(payload.health_timeout_seconds);
            const result = await callBackend('settings', [JSON.stringify(payload)]);
            if (result.ok === false) {
              cockpit.message(result.error || 'Failed to update settings');
            } else {
              await refreshData();
            }
          });
        }
      }

      async function refreshData() {
        const overview = await callBackend('overview');
        renderOverview(overview);

        const apps = await callBackend('list');
        renderApps(apps);

        const deployments = await callBackend('deployments');
        renderDeployments(deployments);

        const settings = await callBackend('settings');
        renderSettings(settings);
      }

      document.getElementById('refreshButton').addEventListener('click', refreshData);
      document.querySelectorAll('.tab').forEach((tab) => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach((item) => item.classList.remove('active'));
          document.querySelectorAll('.tab-panel').forEach((panel) => panel.classList.add('hidden'));
          tab.classList.add('active');
          document.getElementById(tab.dataset.tab).classList.remove('hidden');
        });
      });

      document.getElementById('addAppForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(event.target);
        const payload = Object.fromEntries(formData.entries());
        if (payload.build_config) {
          try {
            payload.build_config = JSON.parse(payload.build_config);
          } catch (error) {
            cockpit.message('Build configuration must be valid JSON object');
            return;
          }
        }

        const result = await callBackend('add', [JSON.stringify(payload)]);
        if (result.ok === false) {
          cockpit.message(result.error || 'Failed to add application');
        } else {
          event.target.reset();
          await refreshData();
        }
      });

      refreshData();
    </script>
  </body>
</html>
